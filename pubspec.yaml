name: pixmint_bot
description: "An intelligent, reusable AI chatbot for Archi Draft featuring a floating 3D robot mascot, role-aware assistance, FAQ guidance, and secure AI integration. Developed by PixelMint Studio MVS."
version: 1.0.0
homepage: https://github.com/pixelmint-studio-mvs/PIXMINT-BOT

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.6.0
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/extracted/
